schema_version: 1

context:
  name: FreeFem
  version: "4.17"
  build_num: 2
  # nompi gets +100 so the solver prefers it by default
  # https://conda-forge.org/docs/maintainer/knowledge_base/#preferring-a-provider-usually-nompi
  build_number: ${{ build_num + 100 if mpi == "nompi" else build_num }}
  # build string prefix so dependents can select a variant:
  #   `freefem * mpi_mpich_*`, `freefem * mpi_*`, `freefem * nompi_*`
  mpi_prefix: ${{ "nompi" if mpi == "nompi" else "mpi_" ~ mpi }}

package:
  name: ${{ name | lower }}
  version: ${{ version }}

source:
  - url: https://github.com/${{ name }}/${{ name }}-sources/archive/refs/tags/v${{ version }}.tar.gz
    sha256: b1198448c0394d42d8371e398aee209a92a50067082d866cdf5f11f56a636835
    patches:
      - Makefile.am_conda.patch
      - Makefile.am_src_bin-win32_conda.patch
      # NLopt>=2.9 removed LD_LBFGS_NOCEDAL
      - ff-NLopt_nlopt-2.9.patch
      # HDF5>=2 h5cc -showconfig lists libs ';'-separated
      - ax_lib_hdf5_cmake-lists.patch
      # detect conda-forge superlu/scotch/mmg/gmm (SuperLu, scotch, mmg, ilut plugins)
      - configure.ac_conda-layout.patch
      # 3rdparty/getall: HPDDM v2.4.1 (the version PETSc 3.26 uses) instead of a 2021 commit that
      # doesn't compile against PETSc >= 3.17 (PetscOptionsBegin is now a statement macro)
      - getall_hpddm-2.4.1.patch
      # upstream bacfd971c9 (PETSc-code.hpp part): HPDDM 2.4.1 removed Wrapper<T>::d__1
      - PETSc-code_petsc-3.26.patch
      # PCHPDDM calls guarded by defined(PCHPDDM) (always true) instead of PETSC_HAVE_HPDDM;
      # conda-forge's PETSc has no HPDDM, so PETSc.so failed to load (undefined PCHPDDMSetAuxiliaryMat)
      - PETSc-code_PCHPDDM-guard.patch
      # make check: drop hpddm/mf-2d-SLEPc.edp (singular-vector comparison fails with -np 4) and
      # ffddm tests that need PETSc-complex/bemtool but are only gated on PETSC
      - examples_skip-unsupported-tests.patch
      # installed FreeFem++ never found its freefem++.pref (so no plugin could be loaded): GCC folds
      # the build-time length of FF_PREFIX_DIR, which breaks when conda relocates the prefix
      - environment_relocatable-prefix.patch
      # make check: CPU ulimit (60 s) and MPIEXEC_TIMEOUT (50 s) overridable (FF_TEST_*)
      - test-driver-ff_cpu-limit.patch
      # bemtool: use boost headers from libboost-headers instead of FreeFEM's bundled boost tarball
      - 3rdparty_boost-from-prefix.patch
  # HPDDM (header-only, not packaged on conda-forge) is needed by the PETSc/SLEPc/hpddm plugins.
  # It is placed where 3rdparty/getall expects it. getall's md5 check (patched above) accepts it,
  # so --enable-download_hpddm uses it without network access.
  - if: mpi != "nompi"
    then:
      url: https://codeload.github.com/hpddm/hpddm/zip/refs/tags/v2.4.1
      sha256: 8c9bbd522900efaa5da25572b2718fc8f8b47a435023d242314adedc9de91727
      file_name: hpddm.zip
      target_directory: 3rdparty/pkg
  # htool + BemTool (header-only, BEM plugins bem.so / RadiativeTransfer_htool.so): the exact
  # commits 3rdparty/getall pins; their md5 matches, so getall uses them as-is
  - if: mpi != "nompi"
    then:
      url: https://github.com/htool-ddm/htool/archive/d7c0fa8b42c461446b92a4891dea78532eeea6b5.zip
      sha256: 4c5f77902d5000add8c4cdd5e82465ce80d9306cb79743ec8ce3da49565a14a5
      file_name: htool.zip
      target_directory: 3rdparty/pkg
  - if: mpi != "nompi"
    then:
      url: https://github.com/PierreMarchand20/BemTool/archive/6381b9029e51d31d2e2d53ea42c10747b70563a9.zip
      sha256: b855d5f1d365bf1cf0a2a1f61fbe4192045420d57aede3c5212c7f1dc961ec53
      file_name: bemtool.zip
      target_directory: 3rdparty/pkg

build:
  number: ${{ build_number }}
  script:
    file: build.sh
    env:
      mpi: ${{ mpi }}
  string: ${{ mpi_prefix }}_h${{ hash }}_${{ build_number }}
  skip:
    - osx
    - win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - ${{ compiler('fortran') }}
    - autoconf
    - automake
    - bison
    - flex
    - m4
    - make
    # HDF5>=2 h5cc is a pkg-config wrapper
    - pkg-config
    - patch
    - unzip
  host:
    - arpack
    - fftw
    - gmm
    - gsl
    - freeglut
    - nlopt
    - metis
    - if: mpi == "nompi"
      then:
        - mumps-seq
        # ipopt needs mumps-seq, which can't coexist with petsc's mumps-mpi (mumps-feedstock#144)
        - ipopt
      else:
        - mumps-mpi
        - ${{ mpi }}
        # PETSc/SLEPc plugins only exist in plugin/mpi
        - petsc
        - slepc
        # parmetis/scalapack only exist as MPI builds; FreeFEM only uses them in plugin/mpi
        - parmetis
        - scalapack
        # bemtool needs boost/math headers
        - libboost-headers
    - mmgsuite
    - scotch
    - hdf5
    - libblas
    - libcblas
    - liblapack
    - suitesparse
    - superlu
    - tetgen
    - zlib
    - zstd
  run:
    - if: mpi != "nompi"
      then: ${{ mpi }}
    - ${{ pin_compatible('hdf5', upper_bound='x.x') }}
  run_exports:
    - ${{ pin_subpackage('freefem', upper_bound='x.x', build=mpi_prefix ~ '_*') }}

tests:
  - package_contents:
      bin:
        - FreeFem++
        - FreeFem++-nw
        - ff-c++
        - ff-get-dep
        - ff-pkg-download
  - script:
      - FreeFem++ -nw $PREFIX/share/FreeFEM/${{ version }}/examples/tutorial/beam.edp
      - FreeFem++ -nw $PREFIX/share/FreeFEM/${{ version }}/examples/3dSurf/buildMeshSfromMesh3.edp
      # an installed plugin loads (needs the relocated freefem++.pref lookup)
      - FreeFem++ -nw $PREFIX/share/FreeFEM/${{ version }}/examples/plugin/ilut.edp
      # MPI variants: the installed PETSc/SLEPc/hpddm plugins load and solve
      - if: mpi != "nompi"
        then:
          - ff-mpirun -np 2 $PREFIX/share/FreeFEM/${{ version }}/examples/hpddm/diffusion-2d-PETSc.edp -nw
          - ff-mpirun -np 2 $PREFIX/share/FreeFEM/${{ version }}/examples/hpddm/laplace-2d-SLEPc.edp -nw
          - ff-mpirun -np 2 $PREFIX/share/FreeFEM/${{ version }}/examples/hpddm/diffusion-substructuring-2d.edp -nw
          - ff-mpirun -np 2 $PREFIX/share/FreeFEM/${{ version }}/examples/ffddm/Helmholtz_circle_BEM.edp -nw

about:
  homepage: https://freefem.org/
  # MPI variants also compile in HPDDM (LGPL-3.0-or-later), BemTool (LGPL-3.0) and htool (MIT)
  license: LGPL-3.0-only AND LGPL-3.0-or-later AND MIT
  license_file:
    - LICENSE.txt
    - if: mpi != "nompi"
      then:
        - 3rdparty/include/hpddm/LICENSE.md
        - 3rdparty/include/BemTool/LICENSE
        - 3rdparty/include/htool/LICENSE
  summary: 'FreeFem : A high level multiphysics finite element software'
  description: >
    FreeFEM is a popular 2D and 3D partial differential equations (PDE) solver used by
    thousands of researchers across the world. It allows you to easily implement your own
    physics modules using the provided FreeFEM language. FreeFEM offers a large list of
    finite elements, like the Lagrange, Taylor-Hood, etc., usable in the continuous and
    discontinuous Galerkin method framework.
  documentation: https://doc.freefem.org
  repository: https://github.com/FreeFem/FreeFem-sources

extra:
  recipe-maintainers:
    - ldallolio
    - cnrdn
    - fbordeu
